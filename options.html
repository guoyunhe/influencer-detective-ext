<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Influencer Detective — Settings</title>
    <link rel="stylesheet" href="src/options/options.css" />
  </head>
  <body>
    <main class="card">
      <h1>Settings</h1>
      <p class="muted">
        Base URL of the Influencer Detective API. Defaults to
        <code>http://localhost:3333</code>.
      </p>

      <form id="form">
        <label for="apiBase">API base URL</label>
        <input
          type="url"
          id="apiBase"
          name="apiBase"
          placeholder="http://localhost:3333"
          autocomplete="off"
        />

        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="reset">Reset to default</button>
        </div>

        <div id="status" class="status"></div>
      </form>

      <hr />
      <p class="muted small">
        When the API runs on a different host, also add that host to
        <code>host_permissions</code> in <code>manifest.json</code> and reload the extension.
      </p>
    </main>

    <script src="../api.js"></script>
    <script type="module" src="src/options/options.js"></script>
  </body>
</html>
